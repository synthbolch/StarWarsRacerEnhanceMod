PreprocessorDefinitions=
Techniques=SMAA@SMAA.fx,ContrastAdaptiveSharpen@CAS.fx,Vibrance@Vibrance.fx
TechniqueSorting=SMAA@SMAA.fx,ContrastAdaptiveSharpen@CAS.fx,Vibrance@Vibrance.fx,LumaSharpen@LumaSharpen.fx,HDR@FakeHDR.fx

[CAS.fx]
Contrast=0.000000
Sharpening=0.600000

[SMAA.fx]
EdgeDetectionType=1
EdgeDetectionThreshold=0.100000
DepthEdgeDetectionThreshold=0.010000
MaxSearchSteps=32
MaxSearchStepsDiagonal=16
CornerRounding=25
PredicationEnabled=0
PredicationThreshold=0.010000
PredicationScale=2.000000
PredicationStrength=0.400000
DebugOutput=0

[Vibrance.fx]
Vibrance=0.100000
VibranceRGBBalance=1.000000,1.000000,1.000000
